<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="430" viewBox="0 0 1700 430" role="img" aria-labelledby="title desc">
<title id="title">ROS 2 graph for the fixed-camera simulation pipeline</title>
<desc id="desc">Simplified ROS 2 graph with nodes, topics, and rosbag recording for the fixed-camera scenario.</desc>
<defs>
<style>
.node-title { font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 24px; fill: #0f172a; }
.node-body { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #475569; }
.frame-text { font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 20px; fill: #0f172a; }
.label { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 600; fill: #0f172a; }
.note { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #475569; }
</style>
<marker id="arrow-sim" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#d97706"/></marker>
<marker id="arrow-gazebo" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#475569"/></marker>
<marker id="arrow-camera" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#0f766e"/></marker>
<marker id="arrow-aruco" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#1d4ed8"/></marker>
<marker id="arrow-robot" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker>
<marker id="arrow-marker" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#b45309"/></marker>
</defs>
<rect x="0" y="0" width="1700" height="430" fill="#ffffff"/>
<rect x="40.0" y="120.0" width="270.0" height="170.0" rx="24.0" ry="24.0" fill="#faecdc" stroke="#d97706" stroke-width="3.0"/>
<rect x="40.0" y="120.0" width="270.0" height="18" fill="#d97706" rx="24" ry="24"/>
<text x="58.0" y="172.0" class="node-title" text-anchor="start">marine_platform</text>
<text x="58.0" y="200.0" class="node-title" text-anchor="start">simulator</text>
<text x="58.0" y="216.0" class="node-body" text-anchor="start">Genera la consigna postural</text>
<text x="58.0" y="240.0" class="node-body" text-anchor="start">de roll, pitch y heave.</text>
<rect x="360.0" y="110.0" width="310.0" height="185.0" rx="24.0" ry="24.0" fill="#e5e7ea" stroke="#475569" stroke-width="3.0"/>
<rect x="360.0" y="110.0" width="310.0" height="18" fill="#475569" rx="24" ry="24"/>
<text x="378.0" y="162.0" class="node-title" text-anchor="start">Gazebo + Go2</text>
<text x="378.0" y="188.0" class="node-body" text-anchor="start">Integra la dinamica del robot,</text>
<text x="378.0" y="212.0" class="node-body" text-anchor="start">el render visual y el estado:</text>
<text x="378.0" y="236.0" class="node-body" text-anchor="start">/odom, /imu/data y postura base.</text>
<rect x="740.0" y="70.0" width="290.0" height="180.0" rx="24.0" ry="24.0" fill="#ddeceb" stroke="#0f766e" stroke-width="3.0"/>
<rect x="740.0" y="70.0" width="290.0" height="18" fill="#0f766e" rx="24" ry="24"/>
<text x="758.0" y="122.0" class="node-title" text-anchor="start">fixed_camera</text>
<text x="758.0" y="148.0" class="node-body" text-anchor="start">Publica la imagen RGB y</text>
<text x="758.0" y="172.0" class="node-body" text-anchor="start">los intrinsecos de camara.</text>
<text x="758.0" y="196.0" class="node-body" text-anchor="start">Pose fija en world.</text>
<rect x="1090.0" y="70.0" width="280.0" height="180.0" rx="24.0" ry="24.0" fill="#dfe6fa" stroke="#1d4ed8" stroke-width="3.0"/>
<rect x="1090.0" y="70.0" width="280.0" height="18" fill="#1d4ed8" rx="24" ry="24"/>
<text x="1108.0" y="122.0" class="node-title" text-anchor="start">aruco_detector</text>
<text x="1108.0" y="148.0" class="node-body" text-anchor="start">Consume los datos de camara</text>
<text x="1108.0" y="172.0" class="node-body" text-anchor="start">y estima la pose del marcador</text>
<text x="1108.0" y="196.0" class="node-body" text-anchor="start">en el frame optico.</text>
<rect x="1425.0" y="115.0" width="225.0" height="240.0" rx="24.0" ry="24.0" fill="#ede3fc" stroke="#7c3aed" stroke-width="3.0"/>
<rect x="1425.0" y="115.0" width="225.0" height="18" fill="#7c3aed" rx="24" ry="24"/>
<text x="1443.0" y="167.0" class="node-title" text-anchor="start">rosbag2</text>
<text x="1443.0" y="195.0" class="node-title" text-anchor="start">recorder</text>
<text x="1443.0" y="211.0" class="node-body" text-anchor="start">Registro persistente para</text>
<text x="1443.0" y="235.0" class="node-body" text-anchor="start">replay y evaluacion offline.</text>
<text x="1443.0" y="259.0" class="node-body" text-anchor="start"></text>
<text x="1443.0" y="283.0" class="node-body" text-anchor="start">Senales:</text>
<text x="1443.0" y="307.0" class="node-body" text-anchor="start">- /aruco/pose</text>
<text x="1443.0" y="331.0" class="node-body" text-anchor="start">- /odom</text>
<text x="1443.0" y="355.0" class="node-body" text-anchor="start">- /imu/data</text>
<text x="1443.0" y="379.0" class="node-body" text-anchor="start">- /base_to_footprint_pose</text>
<line x1="312.0" y1="205.0" x2="352.0" y2="205.0" stroke="#d97706" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-sim)"/>
<line x1="672.0" y1="198.0" x2="735.0" y2="155.0" stroke="#475569" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-gazebo)" stroke-dasharray="12 10"/>
<line x1="1032.0" y1="160.0" x2="1082.0" y2="160.0" stroke="#0f766e" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-camera)"/>
<line x1="1372.0" y1="196.0" x2="1417.0" y2="210.0" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-aruco)"/>
<line x1="672.0" y1="318.0" x2="1418.0" y2="318.0" stroke="#475569" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-gazebo)"/>
<text x="332.0" y="96.0" class="label" text-anchor="middle">/body_pose</text>
<text x="708.0" y="54.0" class="label" text-anchor="middle">escena renderizada</text>
<text x="708.0" y="72.0" class="label" text-anchor="middle">y sensor en Gazebo</text>
<text x="1060.0" y="30.0" class="label" text-anchor="middle">/fixed_camera/camera/image_raw</text>
<text x="1060.0" y="48.0" class="label" text-anchor="middle">/fixed_camera/camera/camera_info</text>
<text x="1378.0" y="250.0" class="label" text-anchor="middle">/aruco/pose</text>
<text x="1045.0" y="386.0" class="label" text-anchor="middle">/odom, /imu/data,</text>
<text x="1045.0" y="404.0" class="label" text-anchor="middle">/base_to_footprint_pose</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="950" viewBox="0 0 1700 950" role="img" aria-labelledby="title desc">
<title id="title">ROS 2 experimental ecosystem</title>
<desc id="desc">Grafo simplificado del pipeline de simulacion con camara fija, incluyendo topicos ROS 2, referencias TF2 y registro reproducible con rosbag.</desc>
<defs>
<style>
.title { font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 34px; fill: #0f172a; }
.subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 19px; fill: #475569; }
.node-title { font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 24px; fill: #0f172a; }
.node-body { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #475569; }
.label { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 600; fill: #0f172a; }
.panel-title { font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 20px; fill: #0f172a; }
.small { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #475569; }
.mini { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #0f172a; }
</style>
<marker id="arrow-sim" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#d97706"/></marker>
<marker id="arrow-gazebo" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#475569"/></marker>
<marker id="arrow-camera" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#0f766e"/></marker>
<marker id="arrow-aruco" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#1d4ed8"/></marker>
<marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#94a3b8"/></marker>
<marker id="arrow-tf" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker>
</defs>
<rect x="0" y="0" width="1700" height="950" fill="#ffffff"/>
<rect x="60.0" y="140.0" width="270.0" height="180.0" rx="24.0" ry="24.0" fill="#f9e9d7" stroke="#d97706" stroke-width="3.0"/>
<rect x="60.0" y="140.0" width="270.0" height="18" fill="#d97706" rx="24" ry="24"/>
<text x="80.0" y="192.0" class="node-title" text-anchor="start">marine_platform</text>
<text x="80.0" y="220.0" class="node-title" text-anchor="start">simulator</text>
<text x="80.0" y="252.0" class="node-body" text-anchor="start">Genera la consigna postural</text>
<text x="80.0" y="276.0" class="node-body" text-anchor="start">de roll, pitch y heave.</text>
<rect x="390.0" y="135.0" width="300.0" height="190.0" rx="24.0" ry="24.0" fill="#e2e4e7" stroke="#475569" stroke-width="3.0"/>
<rect x="390.0" y="135.0" width="300.0" height="18" fill="#475569" rx="24" ry="24"/>
<text x="410.0" y="187.0" class="node-title" text-anchor="start">Gazebo + Go2</text>
<text x="410.0" y="229.0" class="node-body" text-anchor="start">Integra la dinamica del robot,</text>
<text x="410.0" y="253.0" class="node-body" text-anchor="start">el render visual y el estado:</text>
<text x="410.0" y="277.0" class="node-body" text-anchor="start">/odom, /imu/data y postura base.</text>
<rect x="760.0" y="95.0" width="290.0" height="185.0" rx="24.0" ry="24.0" fill="#d9e9e8" stroke="#0f766e" stroke-width="3.0"/>
<rect x="760.0" y="95.0" width="290.0" height="18" fill="#0f766e" rx="24" ry="24"/>
<text x="780.0" y="147.0" class="node-title" text-anchor="start">fixed_camera</text>
<text x="780.0" y="189.0" class="node-body" text-anchor="start">Publica la imagen RGB y</text>
<text x="780.0" y="213.0" class="node-body" text-anchor="start">los intrinsecos de camara.</text>
<text x="780.0" y="237.0" class="node-body" text-anchor="start">Pose fija en world.</text>
<rect x="1105.0" y="95.0" width="270.0" height="185.0" rx="24.0" ry="24.0" fill="#dbe3f9" stroke="#1d4ed8" stroke-width="3.0"/>
<rect x="1105.0" y="95.0" width="270.0" height="18" fill="#1d4ed8" rx="24" ry="24"/>
<text x="1125.0" y="147.0" class="node-title" text-anchor="start">aruco_detector</text>
<text x="1125.0" y="189.0" class="node-body" text-anchor="start">Consume los datos de camara</text>
<text x="1125.0" y="213.0" class="node-body" text-anchor="start">y estima la pose del marcador</text>
<text x="1125.0" y="237.0" class="node-body" text-anchor="start">en el frame optico.</text>
<rect x="1420.0" y="145.0" width="220.0" height="300.0" rx="24.0" ry="24.0" fill="#eadffc" stroke="#7c3aed" stroke-width="3.0"/>
<rect x="1420.0" y="145.0" width="220.0" height="18" fill="#7c3aed" rx="24" ry="24"/>
<text x="1440.0" y="197.0" class="node-title" text-anchor="start">rosbag2</text>
<text x="1440.0" y="225.0" class="node-title" text-anchor="start">recorder</text>
<text x="1440.0" y="257.0" class="node-body" text-anchor="start">Registro persistente para</text>
<text x="1440.0" y="281.0" class="node-body" text-anchor="start">replay y evaluacion offline.</text>
<text x="1440.0" y="305.0" class="node-body" text-anchor="start"></text>
<text x="1440.0" y="329.0" class="node-body" text-anchor="start">Senales almacenadas:</text>
<text x="1440.0" y="353.0" class="node-body" text-anchor="start">- /aruco/pose</text>
<text x="1440.0" y="377.0" class="node-body" text-anchor="start">- /odom</text>
<text x="1440.0" y="401.0" class="node-body" text-anchor="start">- /imu/data</text>
<text x="1440.0" y="425.0" class="node-body" text-anchor="start">- /base_to_footprint_pose</text>
<line x1="334.0" y1="230.0" x2="382.0" y2="230.0" stroke="#d97706" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-sim)"/>
<line x1="693.0" y1="220.0" x2="754.0" y2="175.0" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-gray)" stroke-dasharray="12 10"/>
<line x1="1052.0" y1="188.0" x2="1097.0" y2="188.0" stroke="#0f766e" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-camera)"/>
<line x1="1380.0" y1="220.0" x2="1412.0" y2="235.0" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-aruco)"/>
<line x1="694.0" y1="355.0" x2="1414.0" y2="355.0" stroke="#475569" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-gazebo)"/>
<text x="356.0" y="128.0" class="label" text-anchor="middle">/body_pose</text>
<text x="725.0" y="76.0" class="label" text-anchor="middle">escena renderizada</text>
<text x="725.0" y="96.0" class="label" text-anchor="middle">y sensor en Gazebo</text>
<text x="1070.0" y="54.0" class="label" text-anchor="middle">/fixed_camera/camera/image_raw</text>
<text x="1070.0" y="74.0" class="label" text-anchor="middle">/fixed_camera/camera/camera_info</text>
<text x="1380.0" y="246.0" class="label" text-anchor="middle">/aruco/pose</text>
<text x="1060.0" y="420.0" class="label" text-anchor="middle">/odom, /imu/data,</text>
<text x="1060.0" y="440.0" class="label" text-anchor="middle">/base_to_footprint_pose</text>
<rect x="900.0" y="510.0" width="740.0" height="305.0" rx="24.0" ry="24.0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.0"/>
<text x="924.0" y="544.0" class="panel-title" text-anchor="start">Frames TF2 (caso simplificado)</text>
<rect x="1163.0" y="563.0" width="164.0" height="44.0" rx="14.0" ry="14.0" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="1245.0" y="591.0" class="mini" text-anchor="middle">world</text>
<rect x="988.0" y="653.0" width="164.0" height="44.0" rx="14.0" ry="14.0" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="1070.0" y="681.0" class="mini" text-anchor="middle">odom</text>
<rect x="988.0" y="733.0" width="164.0" height="44.0" rx="14.0" ry="14.0" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="1070.0" y="761.0" class="mini" text-anchor="middle">base_footprint</text>
<rect x="1368.0" y="623.0" width="164.0" height="44.0" rx="14.0" ry="14.0" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="1450.0" y="651.0" class="mini" text-anchor="middle">camera_base_link</text>
<rect x="1368.0" y="698.0" width="164.0" height="44.0" rx="14.0" ry="14.0" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="1450.0" y="726.0" class="mini" text-anchor="middle">camera_link</text>
<rect x="1368.0" y="773.0" width="164.0" height="44.0" rx="14.0" ry="14.0" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="1450.0" y="801.0" class="mini" text-anchor="middle">camera_link_optical</text>
<line x1="1245.0" y1="613.0" x2="1070.0" y2="645.0" stroke="#64748b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-tf)"/>
<line x1="1070.0" y1="703.0" x2="1070.0" y2="725.0" stroke="#64748b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-tf)"/>
<line x1="1325.0" y1="605.0" x2="1366.0" y2="625.0" stroke="#64748b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-tf)"/>
<line x1="1450.0" y1="673.0" x2="1450.0" y2="690.0" stroke="#64748b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-tf)"/>
<line x1="1450.0" y1="748.0" x2="1450.0" y2="765.0" stroke="#64748b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-tf)"/>
<text x="924.0" y="788.0" class="small" text-anchor="start">/aruco/pose se expresa en camera_link_optical.</text>
</svg>
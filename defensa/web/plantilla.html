<!doctype html>
<!-- index.html lo GENERA scripts/build_deck.py: la cáscara sale de
     web/plantilla.html y las láminas de web/slides/, una por archivo.
     Editar index.html a mano es perder el cambio en el próximo build. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Defensa PF · Plataforma marina sintética con Go2</title>
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>

<div id="progress"></div>

<div id="deck">
<!-- SLIDES -->
</div><!-- /deck -->

<!-- Chrome -->
<button id="prev" class="navarrow" aria-label="Anterior"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button>
<button id="next" class="navarrow" aria-label="Siguiente"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>

<div id="hud">
  <span class="block-name"></span>
  <span class="within"><span class="wtxt"></span><span class="dots"></span></span>
  <span class="sep"></span>
  <span class="counter"><span class="cur">1</span> / <span class="tot">30</span></span>
</div>

<div id="hint">
  <span><kbd>→</kbd> avanzar</span><span><kbd>O</kbd> índice</span><span><kbd>B</kbd> backup</span><span><kbd>D</kbd> borrador</span><span><kbd>F</kbd> pantalla completa</span>
</div>

<div id="overview">
  <h2>Índice de la presentación</h2>
  <div id="ov-grid"></div>
</div>

<script src="js/deck.js"></script>
</body>
</html>

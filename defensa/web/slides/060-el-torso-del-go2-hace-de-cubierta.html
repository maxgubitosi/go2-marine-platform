<!-- Unifica las dos láminas que antes presentaban el robot por separado (una

     presentar el Go2, decir que su torso hace de cubierta y mostrar que el
     mismo robot corre en los dos montajes: el par de fotos las dice todas, y

     lámina de control postural, que es donde el detalle hace falta. -->

       en los dos mundos. El tope de ancho sube porque ahora reparten tres. -->
  <style>
    .slide[data-title="Unitree Go2 como plataforma marina"] .dos-mundos {
      grid-template-columns: repeat(3, 1fr);
      max-width: min(100%, 158vh);
